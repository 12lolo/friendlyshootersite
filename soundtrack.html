<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="theme-color" content="#09280f"/>
        <meta name="description" content="Official FriendlyShooter soundtrack page with vinyl cover art and Spotify links."/>
        <title>FriendlyShooter Soundtrack</title>
        <link href="https://static.itch.io/game.css?1773778275" rel="stylesheet"/>
        <link type="image/png" href="https://img.itch.zone/aW1nLzI1ODYyMDI3LnBuZw==/32x32%23/D5oY%2By.png" rel="icon"/>
        <link rel="stylesheet" href="css/site.css"/>
        <link rel="stylesheet" href="css/soundtrack.css"/>
    </head>
    <body class="locale_en game_layout_widget layout_widget no_theme_toggle responsive" data-host="itch.io" data-page_name="view_game">
        <div id="wrapper" class="main wrapper">
            <div class="inner_column size_large family_pixel" id="inner_column">
                <section class="soundtrack-wrap" aria-labelledby="soundtrack-title">
                    <header class="soundtrack-header">
                        <h1 id="soundtrack-title">Official FriendlyShooter Soundtrack</h1>
                        <p>Spin the vinyl covers, then jump straight into Spotify.</p>
                    </header>

                    <div class="soundtrack-actions">
                        <a href="index.html" class="button">Back to Home</a>
                        <a href="https://open.spotify.com/artist/1JJ5zCvRPb3uLLExvM5sbN?si=LsQyCRnnSAmAdbDIWuSBcA4" class="button" target="_blank" rel="noopener noreferrer">Open Spotify Artist</a>
                    </div>

                    <div class="vinyl-grid">
                        <article class="vinyl-card">
                            <h2>Front Cover</h2>
                            <figure class="vinyl-disc">
                                <img src="FS-Soundtrack.jpg" alt="FriendlyShooter soundtrack front cover art"/>
                            </figure>
                            <p class="vinyl-caption">Official FriendlyShooter soundtrack artwork.</p>
                        </article>

                        <article class="vinyl-card">
                            <h2>Back Cover</h2>
                            <figure class="vinyl-disc">
                                <img src="BacksideCoverV2.jpg" alt="FriendlyShooter soundtrack back cover art"/>
                            </figure>
                            <p class="vinyl-caption">Tracklist and world collage on the back cover.</p>
                        </article>
                    </div>

                    <div class="spotify-embed-wrap">
                        <iframe
                            src="https://open.spotify.com/embed/artist/1JJ5zCvRPb3uLLExvM5sbN?utm_source=generator"
                            title="TJWGames on Spotify"
                            loading="lazy"
                            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
                        </iframe>
                    </div>
                </section>
            </div>
        </div>
    </body>
</html>
